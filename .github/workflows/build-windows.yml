name: Build Windows installer

# Zero-install way to get a shippable build: push to GitHub, open the Actions
# tab, run this workflow, and download the artifacts. GitHub compiles it on a
# real Windows machine; you never touch a terminal.
#
# Pushing a version tag also publishes a Release with a PERMANENT download URL
# the website can link to:
#
#     git tag v1.0.1 && git push --tags
#
#     https://github.com/<owner>/<repo>/releases/latest/download/HexR-Companion-Setup.exe
#
# That link keeps working across releases because the asset name has no version
# in it - GitHub resolves /latest/download/<name> by exact filename, so a
# version in the name would break the link on every release. The version lives
# in the tag, the release title, the app's own footer and the exe's file
# properties instead.
#
# Nothing here uses a secret. GITHUB_TOKEN is issued automatically to the job,
# and it can publish releases because the release goes to this same repository.
#
# One workflow does both the branch build and the tagged release on purpose:
# two workflows would compile the same commit twice and could disagree about
# what the release actually contains.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write         # create the release and upload its assets
  id-token: write         # mint the OIDC token build provenance is signed with
  attestations: write     # record that provenance against this repository

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A v1.2.0 tag must produce a 1.2.0 installer, not whatever was last
      # committed. Untagged builds get 0.0.0 so they can never be mistaken for
      # a release.
      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v',''
          } else {
            $v = '0.0.0'
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "building version $v"

      # Everything downstream - the app's own footer, the exe version resource,
      # the installer, the release notes - reads this one file, so there is
      # nothing else to patch.
      - name: Write the version
        shell: pwsh
        run: |
          "${{ steps.ver.outputs.version }}" | Set-Content VERSION -NoNewline
          Get-Content VERSION

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pillow

      - name: Run the tests
        run: |
          python tests/test_protocol.py
          python tests/test_remote.py
          python tests/test_i18n.py
          python tests/test_sideload.py

      # Google's adb, for the APK Sideload screen: the app carries it, so it needs no internet.
      # Pinned to one release and checked against its SHA-256 before it is unpacked.
      - name: Fetch adb
        run: python tools/fetch_adb.py

      # The icon is generated, not checked in as a finished asset. Drawing it
      # here means a release can never ship an icon that lags the generator.
      - name: Draw the app icon
        run: python tools/make_icon.py

      - name: Build the app
        run: pyinstaller --noconfirm --clean HexR-Companion.spec

      # Inno Setup ships preinstalled on the windows-latest runner image.
      # No /D or /S flags: there is no code signing, so the compiler needs
      # nothing from the environment.
      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\HexR-Companion.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }
          if (-not (Test-Path 'Installer\HexR-Companion-Setup.exe')) {
            throw 'expected Installer\HexR-Companion-Setup.exe - the download links depend on this exact name'
          }

      - name: Zip the portable build
        shell: pwsh
        run: |
          Compress-Archive -Path dist\HexR-Companion\* `
            -DestinationPath Installer\HexR-Companion-portable.zip -Force

      # Until 0.4.0 the app was HEXR Window Tester, and its downloads were
      # HexR-Window-Tester-Setup.exe and HexR-Window-Tester-portable.zip. The
      # Microtube website and the Microtube-Apps table still link
      # /releases/latest/download/ under those names, so each release carries
      # the same two files under them too. Drop this step, and the two copies
      # from the release's files below, once they link the new names. Copied
      # before the checksums so SHA256SUMS.txt lists them; being the same
      # bytes, the provenance below covers them as well.
      - name: Keep the old download links working
        shell: pwsh
        run: |
          Copy-Item 'Installer\HexR-Companion-Setup.exe' 'Installer\HexR-Window-Tester-Setup.exe'
          Copy-Item 'Installer\HexR-Companion-portable.zip' 'Installer\HexR-Window-Tester-portable.zip'

      - name: Checksum everything published
        id: files
        shell: pwsh
        run: |
          # sha256sum -c reads this format directly: hash, two spaces, name.
          $lines = Get-ChildItem Installer -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object Name | ForEach-Object {
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
            }
          # Written with LF endings and no BOM, deliberately. Set-Content would
          # use CRLF on Windows, and `sha256sum -c` then treats the trailing
          # carriage return as part of the filename and fails to open every
          # entry - which makes the file useless to exactly the careful user it
          # exists for.
          [IO.File]::WriteAllText(
            "$PWD\Installer\SHA256SUMS.txt",
            (($lines -join "`n") + "`n"),
            (New-Object Text.UTF8Encoding $false))
          Get-Content 'Installer\SHA256SUMS.txt'

          # Surfaced in the release notes too, so the hash to compare against is
          # visible on the release page itself and not only inside a file that
          # arrived over the same connection.
          $h = (Get-FileHash 'Installer\HexR-Companion-Setup.exe' `
                  -Algorithm SHA256).Hash.ToLower()
          "installer_sha256=$h" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: HexR-Companion-Setup
          path: |
            Installer\HexR-Companion-Setup.exe
            Installer\SHA256SUMS.txt

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: HexR-Companion-Portable
          path: Installer\HexR-Companion-portable.zip

      # --- Build provenance -------------------------------------------------
      # The strongest free substitute for a code-signing certificate, and it
      # works because this repository is public - GitHub only issues artifact
      # attestations for public repos, or private ones with Advanced Security.
      #
      # GitHub signs a statement, through Sigstore, that these exact bytes came
      # out of this workflow, from this commit, in this repository. Anyone can
      # check it:
      #
      #     gh attestation verify HexR-Companion-Setup.exe --repo <owner>/<repo>
      #
      # It does NOT silence SmartScreen - only an Authenticode signature does
      # that. What it adds is the one thing a published hash cannot: a hash
      # defends the download against tampering in transit, but it is printed on
      # the same page that serves the file, so whoever controls that page
      # controls both. This signature comes from GitHub instead.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            Installer/HexR-Companion-Setup.exe
            Installer/HexR-Companion-portable.zip

      # --- Release ----------------------------------------------------------
      # GITHUB_TOKEN is provided by Actions and can write releases here, so no
      # secret is stored in this repository.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: HEXR Companion ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body: |
            **Version ${{ steps.ver.outputs.version }}** — Windows 10 or newer.

            ### [Download HexR-Companion-Setup.exe](https://github.com/${{ github.repository }}/releases/latest/download/HexR-Companion-Setup.exe)

            One file. No Python, no developer tools, no driver. It installs for
            the current user only, so it never asks for an administrator
            password, and leaves a **HEXR Companion** icon on your desktop.

            **Windows will warn you the first time.** This build is not code
            signed, so SmartScreen shows *"Windows protected your PC"*. Click
            **More info → Run anyway**. Nothing is wrong; an unsigned installer
            simply has no certificate for Windows to check.

            ### Verify your download

            SHA-256 of `HexR-Companion-Setup.exe`:
            ```
            ${{ steps.files.outputs.installer_sha256 }}
            ```
            ```powershell
            Get-FileHash .\HexR-Companion-Setup.exe -Algorithm SHA256
            ```
            `SHA256SUMS.txt` below covers every file in this release.

            This build also carries GitHub build provenance — proof, signed by
            GitHub rather than by this page, that these bytes were built by this
            repository's workflow from commit `${{ github.sha }}`:
            ```
            gh attestation verify HexR-Companion-Setup.exe --repo ${{ github.repository }}
            ```

            It includes Google's adb, for installing apps on a headset over
            USB from the APK Sideload screen.

            Provided as-is, without warranty of any kind. The app makes no
            network connections and collects no data.
          files: |
            Installer/HexR-Companion-Setup.exe
            Installer/SHA256SUMS.txt
            Installer/HexR-Companion-portable.zip
            Installer/HexR-Window-Tester-Setup.exe
            Installer/HexR-Window-Tester-portable.zip
